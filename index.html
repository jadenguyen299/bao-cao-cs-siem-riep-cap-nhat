.matrix .mom { font-weight: 600; white-space: nowrap; }
.matrix .mom.up { color: #3f6a1c; } .matrix .mom.down { color: #c0262b; } .matrix .mom.flat { color: var(--muted); font-weight: 500; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .matrix .mom.up { color: #9ccc65; } :root:not([data-theme="light"]) .matrix .mom.down { color: #ef6b6b; } }
.kpi-delta.up { color: #3f6a1c; } .kpi-delta.down { color: #c0262b; }

/* customer concentration card */
.conc { display: grid; gap: 14px; }
.conc-tiles { display: flex; gap: 12px; flex-wrap: wrap; }
.conc-t { flex: 1 1 120px; background: var(--mint); border: 1px solid var(--soft); border-radius: 10px; padding: 10px 14px; }
.conc-l { font-size: 12px; color: var(--muted, #5b6b4d); }
.conc-v { font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1.2; }
.conc-s { font-size: 12px; color: var(--muted, #5b6b4d); }
.conc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.conc-list li { display: grid; grid-template-columns: minmax(140px, 280px) 1fr 110px; align-items: center; gap: 10px; font-size: 13px; }
.conc-n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conc-bar { background: var(--soft); border-radius: 6px; height: 16px; overflow: hidden; }
.conc-bar i { display: block; height: 100%; background: var(--jade, #55882a); border-radius: 6px; }
.conc-p { text-align: right; font-variant-numeric: tabular-nums; }

/* heatmap + legend items */
.tbl.heat td.hc { min-width: 62px; border: 1px solid var(--surface); transition: filter .12s; } .tbl.heat td.hc:hover { filter: brightness(.92); }
.legend-row .lg-i { display: inline-flex; align-items: center; margin-left: 12px; } .legend-row .lg-i:first-child { margin-left: 0; } .legend-row .lg-i i { margin-left: 0; margin-right: 5px; }
.tbl.heat tr.mx-prev td{color:var(--muted);font-style:italic}

.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; } .row3 > .card { min-width: 0; }
@media (max-width: 1100px) { .row3 { grid-template-columns: minmax(0, 1fr); } }
.grid2 > .row3.wide { grid-column: 1 / -1; }

.matrix .mx-l3 td { color: var(--muted); font-size: 12.5px; }
.matrix .mx-l1 td { }
.matrix .mx-l4 td { color: var(--muted); font-size: 12.5px; }

.kpis.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } @media (max-width: 760px) { .kpis.three { grid-template-columns: minmax(0, 1fr); } }

.cat-matrix tr.mx-l2 td { color: var(--muted); font-size: 12.5px; }
.seg-row { display: flex; justify-content: flex-start; }
.mx-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.ms-gh { display: flex; gap: 8px; align-items: center; padding: 6px 8px; font-weight: 700; color: var(--accent); cursor: pointer; border-radius: 6px; } .ms-gh:hover { background: var(--wash); }
.ms-ind { padding-left: 26px; }
